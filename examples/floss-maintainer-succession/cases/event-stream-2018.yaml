id: eventStream2018
case_layout: review-v1
canonical_name: 'Event-stream: adversarial maintainer handoff (2018)'
domain: digital_infrastructure
episode_kind: succession_attack
observation_window:
  start_year: 2018
  end_year: 2018
topology:
  resource_type: public_npm_package
  actor_distribution:
    primary_decision_makers: null
    active_participants: null
    dependent_tier: not_measured
  credential_custody: unknown
  exit_barrier: unknown
  authority_concentration: unknown
  feedback_cadence: unknown
stressor:
  category: succession_attack
  event_description: npm reports an attacker posing as a maintainer obtained event-stream maintainership
    and introduced a malicious dependency (npmReport).
  telemetry_onset: delayed
intervention:
  type: registry_containment
  mechanism: npm reports removing flatmap-stream and event-stream 3.3.6 and taking package ownership on
    26 November 2018 (npmReport).
  formal_safeguards: []
perspectives:
  formal_charter: No succession charter is established here. Registry ownership and removal are administrative
    capabilities, not evidence of independent review (npmReport).
  shadow_practice: The reported handoff permitted a dependency change. The targeted environment mattered
    to whether the payload activated (npmReport).
  post_mortem_consensus: 'Draft analyst synthesis: delegated publication can create downstream exposure.
    No independent consensus or evidence that a particular safeguard would have prevented this incident
    is established.'
telemetry:
  t_immediate: '2018-11-26: registry containment reported (npmReport).'
  t_stabilized: 'As of the 2018-11-27 report: affected Copay releases are identified;
    user-loss and recovery measurements are absent. Stabilization is not demonstrated (npmReport).'
  t_terminal: Not observed; no terminal success/failure classification inferred.
structural_divergences:
- parameter: episode_and_outcome_definition
  historical_analog: Treating all five entries as the same kind of succession event
  divergence_rationale: A targeted dependency attack is not equivalent to an accidental library vulnerability
    or every maintainer handoff.
unobserved_variables:
- independent_coder_agreement
- complete_population_denominator
