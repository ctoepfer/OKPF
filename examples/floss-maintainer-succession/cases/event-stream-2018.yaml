- counterfactual_effect_of_governance_changes
- long_term_downstream_outcomes
- contemporaneous_precommitted_failure_thresholds
- intentional_metric_gaming_not_established_except_reported_deception_where_cited
evasion_vectors:
- tactic_category: nominal_compliance
  mechanism: npm reports the attacker presented as a maintainer. The nominal_compliance category is an
    analyst interpretation of that reported deception, not a measured compliance-metric effect.
  telemetry_impact: 'Analyst interpretation: apparent maintainer legitimacy did not establish trustworthy
    downstream releases. No quantitative metric distortion measured.'
  detection_signature: 'Proposed review task: compare recorded approvals/outcomes with independently sampled
    underlying records. Not a validated detector.'
  epistemic_status: source_reported_mechanism_analyst_category
  source_references:
  - npmReport
pre_mortem_falsification:
  leading_indicator_failure: 'Proposed example: any post-handoff release lacks a recorded independent
    review during the first three calendar months.'
  evaluation_horizon_months: 3
  secondary_stress_signals:
  - 'Proposed: missing measurement records or undocumented denominator changes.'
  automated_off_ramp:
