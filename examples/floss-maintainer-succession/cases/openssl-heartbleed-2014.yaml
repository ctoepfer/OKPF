stressor:
  category: security_disclosure_and_capacity_response
  event_description: OpenSSL disclosed a heartbeat bounds-check failure on 7 April 2014 and directed affected
    users to a fixed release or mitigation (opensslAdvisory).
  telemetry_onset: delayed
intervention:
  type: security_fix_and_capacity_funding
  mechanism: The advisory identifies 1.0.1g as the fixed release. A 2023 OpenSSL account says CII later
    funded two full-time workers for three years and an audit (opensslAdvisory; opensslFinance).
  formal_safeguards: []
perspectives:
  formal_charter: A security advisory defines affected versions and remediation. The contemporaneous governance
    and succession charter is not established by these sources (opensslAdvisory).
  shadow_practice: OpenSSL retrospectively describes limited funding and treats the CII support as an
    interim measure (opensslFinance). This is an organizational account, not an independent workload audit.
  post_mortem_consensus: 'Draft analyst synthesis: a security fix and a capacity intervention address
    different outcomes. The sources do not identify a causal effect of staffing on future vulnerability
    incidence.'
telemetry:
  t_immediate: '2014-04-07: upgrade or rebuild advice published (opensslAdvisory).'
  t_stabilized: 2023 retrospective account describes temporary staffing/audit support; population-wide
    remediation and incident rates are unmeasured (opensslFinance).
  t_terminal: Not observed; no terminal success/failure classification inferred.
structural_divergences:
- parameter: episode_and_outcome_definition
  historical_analog: Treating all five entries as the same kind of succession event
  divergence_rationale: This is not a documented malicious maintainer succession; a heartbeat bounds-check defect and
    an authority handoff require different causal accounts.
