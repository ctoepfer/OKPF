stressor:
  category: planned_version_migration_not_leadership_succession
  event_description: The versioned urllib3 2.0.7 guide describes a planned v2 migration with compatibility
    changes and dependent-package testing (urllib3Guide).
  telemetry_onset: chronic
intervention:
  type: staged_migration_guidance
  mechanism: The guide recommends temporary support for both 1.26.x and 2.x in dependent packages and
    attributes then-planned continued 1.26 security support to Tidelift. This is versioned historical
    guidance, not a current support commitment (urllib3Guide).
  formal_safeguards: []
perspectives:
  formal_charter: The guide documents deprecation expectations and migration steps. Its timeline
    includes planned dates, not verified completion dates, and it does not specify a leadership
    handoff charter (urllib3Guide).
  shadow_practice: The guide lists compatibility issues and testing steps. Published guidance does not
    independently demonstrate their adoption or a smooth migration for every consumer (urllib3Guide).
  post_mortem_consensus: 'Draft contrast: planned compatibility support differs from emergency containment.
    Neither a successful leadership succession nor universal smoothness is established.'
telemetry:
  t_immediate: Versioned 2.0.7 guide documents migration and coexistence advice (urllib3Guide).
  t_stabilized: Actual consumer disruption, maintenance workload and leadership succession outcomes were
    not measured.
  t_terminal: Not observed; no terminal success/failure classification inferred.
